<!DOCTYPE html>
<html lang="en" data-theme="midnight">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- house standard 22: every app shares adervec.github.io, so nothing runs that we did not ship -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://adervec.github.io https://accounts.google.com; style-src 'self' 'unsafe-inline' https://adervec.github.io https://accounts.google.com; img-src 'self' blob: data: https://*.googleusercontent.com; media-src 'self' blob: data:; font-src 'self' data: https://adervec.github.io; connect-src 'self' https://adervec.github.io https://www.googleapis.com https://oauth2.googleapis.com https://accounts.google.com; frame-src https://accounts.google.com; manifest-src 'self'; worker-src 'self'; form-action 'none'; base-uri 'none'; object-src 'none'" />
  <title>GuitarPicker</title>
  <meta name="theme-color" content="#0b0f1a" />
  <meta name="app-whatsnew" content="whatsnew.json" />
  <meta name="app-locales" content="locales/" />
  <link rel="icon" type="image/svg+xml" href="icons/logo.svg" />
  <link rel="manifest" href="manifest.json" />
  <!-- house font: Atkinson Hyperlegible by default, reader-changeable under Settings -->
  <script src="https://adervec.github.io/font.js"></script>
  <link rel="stylesheet" href="styles/themes.css" />
  <link rel="stylesheet" href="styles/main.css" />
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div class="brand">
        <div class="brand-mark"><img src="icons/logo.svg" alt="GuitarPicker" width="34" height="34" style="display:block;border-radius:8px" /></div>
        <div class="brand-text">
          <strong>GuitarPicker</strong>
          <span data-t>learn · play · grow</span>
        </div>
      </div>
      <nav id="nav"></nav>
      <div class="sidebar-foot">
        <div id="io-indicator" class="io-indicator" data-t-attr="title" title="Input / output devices">
          <span class="io-row"><span class="io-dot in"></span><span data-io="in">no mic</span></span>
          <span class="io-row"><span class="io-dot out"></span><span data-io="out">default out</span></span>
        </div>
      </div>
    </aside>

    <main id="main">
      <header id="topbar">
        <div id="crumb"></div>
        <div class="topbar-right">
          <div id="health-mini" class="health-mini hidden" data-t-attr="title" title="Health"></div>
          <a id="coin-chip" class="coin-chip" href="#/locker" data-t-attr="title" title="Coins — earn by playing, spend in the Locker">🪙 <b>0</b></a>
          <select id="theme-quick" data-t-attr="title" title="Theme"></select>
          <app-account data-t-attr="title" title="Google Drive sync"></app-account>
        </div>
      </header>
      <section id="view"><!-- active view renders here --></section>
    </main>
  </div>

  <div id="toast-host"></div>

  <script type="module" src="src/app.js"></script>
  <script src="src/boot.js"></script>
</body>
</html>
