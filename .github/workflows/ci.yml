name: CI

# Run the test suite on every push and pull request to the long-lived branches.
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# A newer commit on the same branch/PR supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          # No dependency cache: the app has zero dependencies and no lockfile.

      # `npm test` = check-imports.cjs + test-core.mjs + dom-smoke.mjs.
      # All three use Node built-ins only, so no install step is required.
      - name: Run test suite
        run: npm test
